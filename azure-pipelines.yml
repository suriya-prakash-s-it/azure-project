trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  # ─────────────────────────────────────────────
  # STAGE 1: Build Frontend (React + Vite)
  # ─────────────────────────────────────────────
  - stage: BuildFrontend
    displayName: 'Build Frontend'
    jobs:
      - job: FrontendBuild
        displayName: 'Install & Build React App'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: '20.x'
            displayName: 'Use Node.js 20'

          - script: |
              cd frontend
              npm install
              npm run build
            displayName: 'npm install and build (frontend)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'frontend/dist'
              ArtifactName: 'frontend-dist'
              publishLocation: 'Container'
            displayName: 'Publish Frontend Artifacts'

  # ─────────────────────────────────────────────
  # STAGE 2: Build Backend (Node/Express)
  # ─────────────────────────────────────────────
  - stage: BuildBackend
    displayName: 'Build Backend'
    dependsOn: BuildFrontend
    jobs:
      - job: BackendBuild
        displayName: 'Install Backend Dependencies'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: '20.x'
            displayName: 'Use Node.js 20'

          - script: |
              cd server
              npm install --omit=dev
            displayName: 'npm install (server)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'server'
              ArtifactName: 'backend'
              publishLocation: 'Container'
            displayName: 'Publish Backend Artifacts'
